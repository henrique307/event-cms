services:
  postgres:
    image: postgres:16-alpine
    container_name: event-cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventcms
      POSTGRES_PASSWORD: eventcms
      POSTGRES_DB: eventcms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventcms"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
